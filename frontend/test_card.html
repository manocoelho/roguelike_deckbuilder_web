<!DOCTYPE html>
<html>
<head>
<style>
  .card {
      width: 140px;
      height: 190px;
      border-radius: 8px;
      position: relative;
      color: #fff;
      font-family: sans-serif;
  }
  .image-card {
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: transparent;
      border: none;
      box-shadow: none;
  }
</style>
</head>
<body style="background: #333; padding: 50px;">
  <div class="card image-card" style="background-image: url('assets/images/card_strike.png');">
      <div class="card-name" style="position:absolute; top: 105px; width: 100%; text-align: center; font-size: 1.2rem; color: #fff; text-shadow: 2px 2px 0 #000; background: transparent; border: none;">Strike</div>
      <div class="card-desc" style="position:absolute; top: 142px; left: 0; width: 100%; box-sizing: border-box; text-align: center; font-size: 0.85rem; line-height: 1.1; color: #fff; text-shadow: 1px 1px 0 #000; padding: 0 8px; background: transparent; z-index: 999;">Causa 6 de dano.</div>
  </div>
</body>
</html>
